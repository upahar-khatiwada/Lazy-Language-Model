    label: Widen, ReLU, narrow
    stages:
      - name: Xn
        dims: [T, d]
      - name: Z
        dims: [T, F]
      - name: A
        dims: [T, F]
      - name: out
        dims: [T, d]
    target:
      file: transformer.py
      symbol: transformer.ffn_forward
      match: Z = Xn @ params[p + "ff1_w"] + params[p + "ff1_b"]
