id: tokenizer.build_tokenizer
title: The vocabulary
category: tokenizer
inventory: [M06]
status: implemented
summary: >-
  build_tokenizer trains the merges and then lists the vocabulary. The unknown token comes first, so
  it has id 0. Next come the characters of the text in order of first appearance, then each merged
  token in merge order. A merged string already in the list is not added again.
why: >-
  An id is a row of the token table and a column of the head, so every token needs a fixed id. Keeping
  all the characters means any text made of seen characters can be encoded, even when no merge applies.
equations:
  - id: bpe.vocab
    latex: \text{itos} = [\,\texttt{<unk>}\,] + [\,\text{characters, first seen first}\,] + [\,\text{new merged tokens, in merge order}\,]
    role: none
    label: The order of the vocabulary
