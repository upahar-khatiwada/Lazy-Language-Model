id: attention.merge
title: Merging heads
category: attention
inventory: [M30, M32]
status: implemented
summary: >-
  merge_heads undoes the split. It swaps the first two axes back, then reshapes, so the weighted values
  of the heads sit side by side in one row of width d again.
why: >-
  The output projection and everything after attention work on rows of width d. Merging restores that
  width, and the output projection is then the first step that can combine numbers from different heads.
equations:
  - id: attention.merge
    latex: O = \operatorname{merge}(A V_h) = \begin{bmatrix} A^{(0)} V^{(0)} & \cdots & A^{(H-1)} V^{(H-1)} \end{bmatrix}
    role: forward
    label: Heads side by side
symbols:
  - symbol: O
    meaning: The merged weighted values
    codeName: O
    shape: (T, d)
  - symbol: A^{(h)}, V^{(h)}
    meaning: The weights and values of head h
    codeName: A[h], Vh[h]
    shape: (T, T) and (T, d_h)
example: null
shapes:
  - id: attention-merge
    label: The transpose, then the reshape, in merge_heads
    stages:
      - name: A @ Vh
        dims: [H, T, dh]
      - name: transpose
        dims: [T, H, dh]
      - name: O
        dims: [T, d]
    target:
      file: transformer.py
      symbol: transformer.merge_heads
      match: return Mh.transpose(1, 0, 2).reshape(T, H * dh)
source:
  - file: transformer.py
    symbol: transformer.merge_heads
