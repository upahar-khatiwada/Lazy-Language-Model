id: transformer.block_backward
title: Residual connections, backward
category: feed-forward-and-block
inventory: [M41]
status: implemented
summary: >-
  block_backward runs the block in reverse. It receives dY, the gradient of the loss on the block's
  output, and returns dX, the gradient on its input. At each residual add, the gradient splits into a
  part that goes through the branch and a part that goes around it. The two parts are added.
why: >-
  Every parameter in the block needs a gradient, so the gradient has to go through both branches. X
  also reaches the output along the identity path, so dX needs that part too, and it goes on to the
  block before this one.
equations:
  - id: block.back.dxn2
    latex: dX_{n2} = \operatorname{FFN}^{\text{back}}(dY)
    role: backward
    label: Through the feed-forward branch
  - id: block.back.branch2
    latex: dX_1^{\text{branch}} = \operatorname{LN}_2^{\text{back}}(dX_{n2})
    role: backward
    label: Through the second LayerNorm
  - id: block.back.dx1
    latex: dX_1 = dY + dX_1^{\text{branch}}
    role: backward
    label: Second add, reversed
  - id: block.back.dxn
    latex: dX_n = \operatorname{Attention}^{\text{back}}(dX_1)
    role: backward
    label: Through the attention branch
  - id: block.back.branch1
    latex: dX^{\text{branch}} = \operatorname{LN}_1^{\text{back}}(dX_n)
    role: backward
    label: Through the first LayerNorm
  - id: block.back.dx
    latex: dX = dX_1 + dX^{\text{branch}}
    role: backward
    label: First add, reversed
  - id: block.back.terms
    latex: >-
      \frac{\partial Y}{\partial \mathrm{Ff}} = I
      \;\Rightarrow\; d\mathrm{Ff} = dY,
      \qquad
      \frac{\partial X_1}{\partial \mathrm{Att}} = I
      \;\Rightarrow\; d\mathrm{Att} = dX_1
    role: backward
    label: What each branch receives
    derived: true
  - id: block.back.identity
    latex: >-
      Y = X_1 + \mathrm{Ff}(X_1)
      \;\Rightarrow\;
      dX_1 = dY \left( I + \frac{\partial \mathrm{Ff}}{\partial X_1} \right)
      = dY + dY \frac{\partial \mathrm{Ff}}{\partial X_1}
    role: backward
    label: Why the identity path carries dY unchanged
    derived: true
