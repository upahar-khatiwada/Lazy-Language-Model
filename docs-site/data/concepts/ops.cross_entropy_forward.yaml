id: ops.cross_entropy_forward
title: Cross-entropy
category: loss
inventory: [M23]
status: implemented
summary: >-
  The loss. For each position it takes the log-probability the model gave to the correct next token,
  negates it, and averages over positions. It also returns the probabilities, which the backward pass
  reuses.
why: >-
  Training needs one number to reduce. This loss falls when the model gives more probability to the
  correct token. The code works in log-probabilities, so it never takes the log of a number that has
  underflowed to 0.
equations:
  - id: ce.shift
    latex: z_{tv} = \text{logits}_{tv} - \max_{k} \text{logits}_{tk}
    role: forward
    label: The same shift as softmax, written inline
  - id: ce.logp
    latex: \log p_{tv} = z_{tv} - \log \sum_{k} e^{z_{tk}}
    role: forward
    label: Log-softmax
  - id: ce.loss
    latex: L = -\frac{1}{T} \sum_{t} \log p_{t,\, y_t}
    role: forward
    label: Mean over positions
  - id: ce.probs
    latex: P_{tv} = e^{\log p_{tv}}
    role: forward
    label: The probabilities it returns
symbols:
