id: data.make_windows
title: Sliding windows
category: data
inventory: [M08]
status: derived
summary: >-
  make_windows slides a window of T ids along the stream, moving k ids each time. The inputs are the
  window. The targets are the window that starts one id later, so each input row moves one place
  left and gains one new id at the end.
why: >-
  The model reads a fixed number of tokens at once, and training needs a correct answer for every
  position. Shifting by one makes each target the id that comes right after the input at that position.
equations:
  - id: windows.starts
    latex: s \in \{0,\, k,\, 2k,\, \dots\}, \qquad s < N - T
    role: none
    label: Where windows start
  - id: windows.input
    latex: x^{(s)}_{t} = \text{ids}_{s+t}, \qquad t = 0, \dots, T-1
    role: none
    label: Inputs
  - id: windows.target
    latex: y^{(s)}_{t} = \text{ids}_{s+t+1}, \qquad t = 0, \dots, T-1
    role: none
    label: Targets
  - id: windows.shift
    latex: y^{(s)}_{t} = x^{(s)}_{t+1}, \qquad t = 0, \dots, T-2
    role: none
    label: Targets are inputs shifted by one
symbols:
  - symbol: s
    meaning: Start position of a window
    codeName: starts
    shape: (W,) for all of them
  - symbol: t
    meaning: Position inside the window
    codeName: np.arange(seq_len)
    shape: scalar
  - symbol: k
    meaning: How far the window moves each time
    codeName: stride
    shape: scalar
  - symbol: T
    meaning: Window length
    codeName: seq_len
    shape: scalar
  - symbol: N
    meaning: Number of ids given to make_windows
    codeName: len(ids)
    shape: scalar
  - symbol: x
    meaning: Inputs, one row per window
    codeName: inputs
    shape: (W, T)
  - symbol: y
    meaning: Targets, one row per window
    codeName: targets
    shape: (W, T)
example: null
