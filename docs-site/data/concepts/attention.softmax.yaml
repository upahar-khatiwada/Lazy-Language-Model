id: attention.softmax
title: Softmax per row
category: attention
inventory: [M32]
status: implemented
summary: >-
  softmax_forward turns each row of masked scores into weights that are not negative and add up to 1.
  It works along the last axis, so each row of each head is computed on its own.
why: >-
  The output of a position is a weighted average of value rows, so its weights need to add up to 1.
  Masked cells get a weight of exactly 0, so their values contribute nothing.
equations:
  - id: attention.softmax
    latex: A = \operatorname{softmax}(S), \qquad \sum_{j} A_{ij} = 1
    role: forward
    label: Weights, one row at a time
  - id: attention.masked-zero
    latex: >-
      \exp(-\infty) = 0 \quad\Rightarrow\quad A_{ij} = 0 \text{ for } j > i
    role: forward
    label: A masked cell has a weight of exactly 0
symbols:
  - symbol: A
    meaning: Attention weights, one matrix per head
    codeName: A
    shape: (H, T, T)
  - symbol: A_{ij}
    meaning: How much of position j's value position i receives
    codeName: A[h, i, j]
    shape: scalar
  - symbol: z_i
    meaning: One number in the row softmax receives. Here, one masked score
    codeName: x
    shape: scalar
  - symbol: c
    meaning: The constant subtracted from a row. The code uses the row's largest score
    codeName: np.max(x, axis=-1, keepdims=True)
    shape: one per row
