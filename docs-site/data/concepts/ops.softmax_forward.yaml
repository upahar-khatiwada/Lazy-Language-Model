id: ops.softmax_forward
title: Softmax
category: basic-operations
inventory: [M21]
status: implemented
summary: >-
  Turns a vector of scores into probabilities along the last axis. The code subtracts the largest
  score first, so the exponentials cannot overflow.
why: >-
  Attention uses it to turn scores into weights, and sampling uses it to turn logits into a
  distribution over tokens.
equations:
  - id: softmax.shift
    latex: e_i = \exp\left(x_i - \max_k x_k\right)
    role: forward
    label: Shift by the maximum, then exponentiate
  - id: softmax.normalize
    latex: p_i = \frac{e_i}{\sum_k e_k}
    role: forward
    label: Normalize
  - id: softmax.safe
    latex: \frac{e^{x_i - c}}{\sum_k e^{x_k - c}} = \frac{e^{-c}\, e^{x_i}}{e^{-c} \sum_k e^{x_k}} = \frac{e^{x_i}}{\sum_k e^{x_k}}
    role: forward
    label: Why the shift is safe. The factor from any constant c cancels
symbols:
  - symbol: x
    meaning: Input scores
    codeName: x
    shape: any; the last axis holds the scores
  - symbol: c
    meaning: The constant subtracted. The code uses the largest score
    codeName: np.max(x, axis=-1, keepdims=True)
    shape: same as x, with 1 on the last axis
  - symbol: e
    meaning: Shifted exponentials
    codeName: e
    shape: same as x
  - symbol: p
    meaning: Probabilities, which sum to 1 along the last axis
    codeName: null
    shape: same as x
example:
  kind: illustrative
  call: ops.softmax_forward
  input:
    x: [2, 1, 0]
  steps:
    - id: shifted
      label: Shifted exponentials
      equationId: softmax.shift
      capture: e
  output:
    label: Probabilities
  precision: 4
shapes:
  - id: attention
    label: Attention weights
    stages:
      - name: S
        dims: [H, T, T]
      - name: A
        dims: [H, T, T]
    target:
      file: transformer.py
      symbol: transformer.attention_forward
      match: A = softmax_forward(S)
  - id: sampling
    label: Sampling
    stages:
      - name: logits / temperature
        dims: [V]
      - name: p
        dims: [V]
    target:
      file: generate.py
      symbol: generate.sample_next
      match: p = softmax_forward(logits / temperature)
source:
  - file: ops.py
    symbol: ops.softmax_forward
usedBy:
  - file: ops.py
    symbol: ops.cross_entropy_forward
    match: z = logits - logits.max(axis=-1, keepdims=True)
    note: The same shift by the maximum, written inline before the log-softmax.
pdfRef:
  section: "4.3"
  equations: ["23"]
  page: 7
notes:
  - The PDF names this softmax(z, axis=-1). The code is softmax_forward(x) and always uses the last axis.
