id: ops.linear_forward
title: Linear layer
category: basic-operations
inventory: [M16, M17]
status: implemented
summary: >-
  A linear layer multiplies its input by a weight matrix and adds a bias to every row. The function
  ops.linear_forward holds this formula, but the model never calls it. transformer.py writes the same
  expression in place at seven sites.
why: >-
  It is how the model mixes the features of a token vector and moves between widths such as d, F and
  V. Query, key, value and the attention output are linear layers. So are both feed-forward layers and
  the head.
equations:
  - id: linear.forward
    latex: Y = XW + b
    role: forward
    label: The linear layer, with b added to every row of XW
symbols:
  - symbol: X
    meaning: Input, one row per token
    codeName: X
    shape: (T, a)
  - symbol: W
    meaning: Weight matrix. A parameter
    codeName: W
    shape: (a, c)
  - symbol: b
    meaning: Bias, added to every row by broadcasting. A parameter
    codeName: b
    shape: (c,)
  - symbol: Y
    meaning: Output, one row per token. The helper returns it without naming it
    codeName: null
    shape: (T, c)
  - symbol: a, c
    meaning: Input and output width. They are d, F or V, depending on the layer
    codeName: null
    shape: scalar
example: null
shapes:
  - id: attention-output
    label: Attention output projection, width stays the same
    stages:
      - name: O
        dims: [T, d]
      - name: out
        dims: [T, d]
    target:
      file: transformer.py
      symbol: transformer.attention_forward
      match: out = O @ params[p + "wo"] + params[p + "bo"]
  - id: first-feed-forward
    label: First feed-forward layer, width grows
    stages:
      - name: Xn
        dims: [T, d]
      - name: Z
        dims: [T, F]
    target:
      file: transformer.py
      symbol: transformer.ffn_forward
      match: Z = Xn @ params[p + "ff1_w"] + params[p + "ff1_b"]
  - id: second-feed-forward
    label: Second feed-forward layer, width shrinks back
    stages:
      - name: A
        dims: [T, F]
      - name: output
        dims: [T, d]
    target:
      file: transformer.py
      symbol: transformer.ffn_forward
      match: return A @ params[p + "ff2_w"] + params[p + "ff2_b"]
  - id: linear-head
    label: Linear head, width becomes the vocabulary size
    stages:
      - name: Xf
        dims: [T, d]
      - name: logits
        dims: [T, V]
    target:
      file: transformer.py
      symbol: transformer.forward
      match: logits = Xf @ params["head_w"] + params["head_b"]
source:
  - file: ops.py
    symbol: ops.linear_forward
usedBy:
  - file: transformer.py
    symbol: transformer.attention_forward
    match: Q = Xn @ params[p+"wq"] + params[p+"bq"]
    note: Query.
  - file: transformer.py
    symbol: transformer.attention_forward
    match: K = Xn @ params[p+"wk"] + params[p+"bk"]
    note: Key.
  - file: transformer.py
    symbol: transformer.attention_forward
    match: V = Xn @ params[p+"wv"] + params[p+"bv"]
    note: Value.
  - file: transformer.py
    symbol: transformer.attention_forward
    match: out = O @ params[p + "wo"] + params[p + "bo"]
    note: Attention output.
  - file: transformer.py
    symbol: transformer.ffn_forward
    match: Z = Xn @ params[p + "ff1_w"] + params[p + "ff1_b"]
    note: First feed-forward layer.
  - file: transformer.py
    symbol: transformer.ffn_forward
    match: return A @ params[p + "ff2_w"] + params[p + "ff2_b"]
    note: Second feed-forward layer.
  - file: transformer.py
    symbol: transformer.forward
    match: logits = Xf @ params["head_w"] + params["head_b"]
    note: The head.
pdfRef:
  section: "4.3"
  equations: ["19"]
  page: 6
notes:
  - The PDF writes the bias as 1b^T. The code relies on NumPy broadcasting to add b to every row.
