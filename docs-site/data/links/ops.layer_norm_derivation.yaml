  - equationId: ln.derive.result
    file: ops.py
    symbol: ops.layer_norm_backward
    match: "- Xhat * (dXhat * Xhat).mean(axis=-1, keepdims=True))"
    role: implements
  - equationId: ln.derive.parameters
